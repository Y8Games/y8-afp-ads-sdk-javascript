<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Y8 SDK Test</title>

<script src="https://cdn.y8.com/minimal-sdk/2-0/y8.min.js" async></script>
<script src="y8-functions.js"></script>

<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    max-width: 100%;
    overflow-x: hidden;
  }

  body {
    font-family: Arial, sans-serif;
    padding: 20px 25px;
    color: #1a1a1a;
    background: #ffffff;
  }

  h1.page-title {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 28px;
    font-weight: bold;
    margin: 0 0 20px 0;
  }

  .topbar {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
  }

  .topbar button {
    background: #6b7280;
    padding: 8px 16px;
    font-size: 13px;
  }

  .layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 40px;
    width: 100%;
    max-width: 1300px;
  }

  @media (max-width: 640px) {
    .layout {
      grid-template-columns: 1fr;
    }
  }

  section {
    margin-bottom: 34px;
  }

  h2.section-title {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 20px;
    font-weight: bold;
    margin: 0 0 14px 0;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  h2.section-title .welcome-text {
    font-family: Arial, sans-serif;
    font-weight: normal;
    font-size: 15px;
    color: #555;
  }

  .btn-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .btn-grid.single {
    grid-template-columns: 1fr;
    max-width: 260px;
  }

  button {
    background: #3f5fc4;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 14px 18px;
    font-size: 15px;
    font-family: Arial, sans-serif;
    cursor: pointer;
    text-align: center;
    transition: background 0.15s ease;
  }

  button:hover {
    background: #34509f;
  }

  .row-offset {
    grid-column: 2;
  }

  .game-state-text {
    font-size: 15px;
    margin: 0 0 14px 0;
  }

  .platform-status {
    margin-top: 12px;
    font-size: 14px;
    color: #444;
  }

  .panel {
    width: 100%;
    max-width: 500px;
    height: 300px;
    border: 2px solid #444;
    border-radius: 6px;
    margin-top: 14px;
  }

  .profile-box {
    border: 2px solid #444;
    border-radius: 6px;
    padding: 14px;
    margin-top: 14px;
    max-width: 500px;
  }

  .profile-box p {
    margin: 0 0 10px 0;
    font-size: 14px;
    color: #444;
  }

  #previewCanvas {
    border-radius: 10px;
    max-width: 100%;
  }

  .profile-box .btn-grid {
    margin-top: 12px;
  }
</style>

</head>

<body>

<div class="topbar">
  <button onclick="initY8()">Init SDK</button>
</div>

<div class="layout">

  <!-- LEFT COLUMN -->
  <div class="col-left">

    <section>
      <h2 class="section-title">
        Authentication
        <span class="welcome-text">Welcome <span id="welcomeText">Guest</span></span>
      </h2>
      <div class="btn-grid single" style="margin-left:auto; max-width:none; grid-template-columns:1fr 1fr;">
        <button id="Login" onclick="login()">Login</button>
        <button id="Logout" onclick="logout()" style="display:none;">Logout</button>
      </div>
      <div class="btn-grid" style="margin-top:10px;">
        <button onclick="getUser()">Get User</button>
        <button onclick="reloadUser()">Reload User</button>
        <button onclick="getToken()">Get Token</button>
        <button onclick="refreshToken()">Refresh Token</button>
      </div>
    </section>

    <section>
      <h2 class="section-title">Ads</h2>
      <div class="btn-grid">
        <button onclick="showAd()">Show Ad</button>
        <button onclick="showRewardAd()">Reward Ad</button>
      </div>
    </section>

    <section>
      <h2 class="section-title">Leaderboards</h2>
      <div class="btn-grid">
        <button onclick="getLeaderboards()">Get Leaderboards</button>
        <button onclick="getScores()">Get Scores</button>
        <button onclick="saveScore()">Save Score</button>
        <button onclick="showLeaderboard()">Show Leaderboard</button>
        <button onclick="embedLeaderboard()">Embed Leaderboard</button>
        <button onclick="destroyLeaderboard()">Destroy Embedded</button>
      </div>
      <div id="leaderboard-panel" class="panel"></div>
    </section>

    <section>
      <h2 class="section-title">Game State</h2>
      <p class="game-state-text">
        Coins: <span id="coinsText">0</span> |
        Score: <span id="scoreText">0</span> |
        Level: <span id="levelText">1</span>
      </p>
      <div class="btn-grid">
        <button onclick="addCoins()">+ Coins</button>
        <button onclick="addScore()">+ Score</button>
        <button onclick="addLevel()">+ Level</button>
      </div>
    </section>

  </div>

  <!-- RIGHT COLUMN -->
  <div class="col-right">

    <section>
      <h2 class="section-title">Achievements</h2>
      <div class="btn-grid">
        <button onclick="getAchievements()">Get Achievements</button>
        <button onclick="awardAchievement()">Award Achievement</button>
        <button onclick="showAchievements()">Show Achievements</button>
        <div></div>
        <button onclick="embedAchievements()">Embed Achievements</button>
        <button onclick="destroyAchievements()">Destroy Embedded</button>
      </div>
      <div id="achievements-panel" class="panel"></div>
    </section>

    <section>
      <h2 class="section-title">Online Saves</h2>
      <div class="btn-grid">
        <button onclick="saveData()">Save Data</button>
        <button onclick="loadData()">Load Data</button>
        <button onclick="removeData()">Remove Data</button>
      </div>
    </section>

    <section>
      <h2 class="section-title">Profile</h2>
      <div class="btn-grid">
        <button onclick="openProfile()">Open Profile</button>
        <button onclick="submitImage()">Submit Image</button>
      </div>
      <div class="profile-box">
        <p>Preview</p>
        <canvas id="previewCanvas" width="460" height="220"></canvas>
        <div class="btn-grid">
          <button onclick="randomizeCanvas()">🎲 Randomize</button>
          <button onclick="submitImage()">Submit Image</button>
        </div>
      </div>
    </section>

    <section>
      <h2 class="section-title">Platform</h2>
      <div class="btn-grid">
        <button onclick="getLocale()">Get Locale</button>
        <button onclick="checkBlacklist()">Check Blacklist</button>
      </div>
      <div class="platform-status">
        <p>Locale: <span id="localeText">-</span></p>
        <p>Status: <span id="blacklistText">-</span></p>
      </div>
    </section>

  </div>

</div>

</body>
</html>
